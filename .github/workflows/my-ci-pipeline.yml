name: Continuous Integration
on: 
  push:
    paths-ignore: 
      - README.md
  pull_request:
    paths-ignore: 
      - README.md

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4You have Docker installed on your system. Do you want to install the
    - run: echo Hello World
    - run: docker build --tag todo-app:test --target test .
    - run: docker run todo-app:test
  deploy:
    name: deploying application
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{secrets.WEBHOOK_URL}}
      DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
      DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production --tag kemiosborne/todoapp .
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: docker push kemiosborne/todoapp
      - run: curl -v -X POST "$WEBHOOK_URL"


    